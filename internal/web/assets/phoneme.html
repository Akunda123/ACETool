<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>音素预览</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    html,body{height:100%}
    body{margin:0;background:var(--bg,#282c33);color:var(--fg,#d6dae0);display:flex;flex-direction:column;overflow:hidden;
      font:13px/1.6 "Microsoft YaHei",system-ui,sans-serif}
    .bar{display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;flex:0 0 auto;border-bottom:1px solid var(--line,#3f434a)}
    .bar h1{font-size:13px;margin:0;font-weight:600}
    .bar .sp{flex:1}
    .stat{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim,#9498a0);min-width:0}
    .stat span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--bad,#e06c75);flex:0 0 auto}
    .dot.on{background:#5ebd7a}
    .btn{border:1px solid var(--line,#3f434a);background:var(--panel,#2f333a);color:var(--fg,#d6dae0);border-radius:6px;
      padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;flex:0 0 auto}
    .btn:hover{border-color:var(--accent,#1a73e8)}
    .btn:disabled{opacity:.45;cursor:default}
    .warn{margin:0 0 10px;padding:8px 10px;border:1px solid var(--warn,#d9a441);border-left-width:4px;
      border-radius:6px;background:rgba(217,164,65,.12);color:#ffd89a;font-size:12.5px}
    .msg{color:var(--dim,#9498a0);font-size:12px}

    /* 左：音符网格；右：固定检查器（不浮动、不跟随、不跳动） */
    .split{flex:1 1 auto;display:flex;min-height:0}
    .left{flex:1 1 auto;overflow:auto;padding:10px;min-width:0}
    .right{flex:0 0 340px;border-left:1px solid var(--line,#3f434a);display:flex;flex-direction:column;min-height:0;
      background:var(--panel,#2f333a)}
    .right .hd{padding:8px 10px;border-bottom:1px solid var(--line,#3f434a);font-size:12.5px;font-weight:600}
    .right .bd{flex:1 1 auto;overflow:auto;padding:8px 10px}
    .right .ft{padding:8px 10px;border-top:1px solid var(--line,#3f434a);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .empty{color:var(--dim,#9498a0);font-size:12px;padding:8px 0}

    .grid{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
    .note{position:relative;min-width:64px;padding:5px 7px 6px;border:1px solid var(--line,#3f434a);border-radius:8px;
      background:var(--inset,#242830);cursor:pointer;user-select:none}
    .note:hover{border-color:var(--accent,#1a73e8)}
    .note.on{border-color:var(--accent,#1a73e8);box-shadow:0 0 0 1px var(--accent,#1a73e8) inset}
    .note .phons{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-bottom:3px}
    .note .ph{font:11.5px/1.3 ui-monospace,Consolas,monospace;color:#9fd2ff;background:rgba(26,115,232,.14);
      border:1px solid rgba(26,115,232,.35);border-radius:4px;padding:0 4px}
    .note .word{text-align:center;font-size:16px;line-height:1.2}
    .note .sub{text-align:center;font-size:10.5px;color:var(--dim,#9498a0);margin-top:1px}
    .note.ov{border-color:rgba(217,164,65,.65)}
    .note.ov .word{color:#ffd89a}
    .note .dotov{position:absolute;right:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--warn,#d9a441)}

    /* 检查器里的音素行：点符号展开候选（候选列表就在行内向下展开，不浮动） */
    .tok{border-bottom:1px dashed rgba(255,255,255,.06);padding:4px 0}
    .tok:last-child{border-bottom:0}
    .tok .line{display:flex;align-items:center;gap:8px}
    .tok .sym{min-width:48px;text-align:center;font:12px ui-monospace,Consolas,monospace;color:#9fd2ff;
      background:rgba(26,115,232,.14);border:1px solid rgba(26,115,232,.35);border-radius:5px;padding:2px 8px;cursor:pointer}
    .tok .sym:hover{border-color:var(--accent,#1a73e8);background:rgba(26,115,232,.24)}
    .tok .meta{color:var(--dim,#9498a0);font-size:11.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cands{margin:4px 0 2px 0;display:none;flex-wrap:wrap;gap:4px}
    .cands.open{display:flex}
    .cand{font:12px ui-monospace,Consolas,monospace;border:1px solid var(--line,#3f434a);border-radius:5px;
      padding:2px 7px;cursor:pointer;background:var(--inset,#242830);white-space:nowrap}
    .cand:hover{border-color:var(--accent,#1a73e8);background:rgba(26,115,232,.2)}
    .cand.on{border-color:var(--accent,#1a73e8);color:#9fd2ff}
    .right .ok{color:#5ebd7a}
    .right .bad{color:var(--bad,#e06c75)}
  </style>
</head>

<body>
  <div class="bar">
    <h1>音素预览</h1>
    <span class="stat"><span class="dot" id="dot"></span><span id="stat">读取中…</span></span>
    <span class="sp"></span>
    <button class="btn" id="refresh" type="button">刷新</button>
  </div>

  <div class="split">
    <div class="left">
      <div class="warn">上排音素、下排歌词。<b>点音符</b>在右侧检查器里改音素，改完点「应用」。</div>
      <div class="grid" id="grid"></div>
      <div class="msg" id="scope"></div>
    </div>
    <div class="right">
      <div class="hd" id="insHead">检查器</div>
      <div class="bd" id="insBody"><div class="empty">点左边的音符</div></div>
      <div class="ft">
        <button class="btn" id="apply" type="button" disabled>应用</button>
        <button class="btn" id="reset" type="button" disabled>恢复默认</button>
        <span class="msg" id="insMsg"></span>
      </div>
    </div>
  </div>

  <script>
    var H = { 'Content-Type': 'application/json', 'X-ACETool': '1' };
    var $ = function (id) { return document.getElementById(id); };
    var CUR = null;          // 检查器里的音符对象
    var CUR_EL = null;       // 对应卡片
    var PICK = {};           // 本音符待提交的修改：idx → symbol

    async function run(toolId, values) {
      var res = await fetch('/api/run', {
        method: 'POST', headers: H, body: JSON.stringify({ toolId: toolId, values: values || {} }),
      });
      var data = null;
      try { data = await res.json(); } catch (e) { }
      if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
      return data;
    }
    function firstJSON(d) { return ((d.calls || [])[0] || {}).json || {}; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

    function langKey(n) {
      var l = (n.language || '').toLowerCase();
      if (l.indexOf('chin') >= 0) return 'zh';
      if (l.indexOf('japan') >= 0) return 'jp';
      if (l.indexOf('engl') >= 0) return 'eng';
      if (l.indexOf('span') >= 0) return 'spa';
      return 'zh';
    }
    function catOf(n) { return (window.__catalog && window.__catalog[langKey(n)]) || {}; }
    function metaText(c) {
      if (!c) return '—';
      return [c.ipa ? '/' + c.ipa + '/' : '', c.manner || '', c.official || '', c.example ? '如 ' + c.example : '']
        .filter(Boolean).join(' · ') || '—';
    }

    function showInspector(n, el) {
      CUR = n; CUR_EL = el; PICK = {};
      [].slice.call(document.querySelectorAll('.note.on')).forEach(function (x) { x.classList.remove('on'); });
      el.classList.add('on');
      $('apply').disabled = false;
      $('reset').disabled = false;
      $('insMsg').textContent = '';
      renderInspector();
    }

    function renderInspector() {
      var n = CUR;
      if (!n) return;
      var cat = catOf(n);
      $('insHead').textContent = (n.lyric || '（无歌词）') + ' · ' + (n.language || '') + ' · 音高 ' + n.pitch;
      var rows = (n.tokens || []).map(function (t, i) {
        var cur = PICK[i] || t.symbol;
        var cands = (t.candidates && t.candidates.length ? t.candidates : [t.symbol]).slice(0, 200);
        var candHtml = cands.map(function (c) {
          return '<span class="cand' + (c === cur ? ' on' : '') + '" data-i="' + i + '" data-v="' + esc(c) + '" title="' +
            esc(metaText(cat[c])) + '">' + esc(c) + '</span>';
        }).join('');
        return '<div class="tok" data-i="' + i + '">' +
          '<div class="line"><span class="sym" data-i="' + i + '">' + esc(cur) + '</span>' +
          '<span class="meta" data-mi="' + i + '">' + esc(metaText(cat[cur])) + '</span></div>' +
          '<div class="cands" id="cands-' + i + '">' + candHtml + '</div></div>';
      }).join('');
      $('insBody').innerHTML = (rows || '<div class="empty">这个音符没读到音素</div>') +
        ((n.timings && n.timings.length) ? '<div class="empty">时值类别：' + esc(n.timings.join(' / ')) + '</div>' : '');

      [].slice.call($('insBody').querySelectorAll('.sym')).forEach(function (b) {
        b.addEventListener('click', function () {
          // 一次只展开一个，避免长列表滚来滚去
          [].slice.call($('insBody').querySelectorAll('.cands.open')).forEach(function (x) { x.classList.remove('open'); });
          var box = $('cands-' + b.getAttribute('data-i'));
          if (box) box.classList.add('open');
        });
      });
      [].slice.call($('insBody').querySelectorAll('.cand')).forEach(function (c) {
        c.addEventListener('click', function () {
          PICK[parseInt(c.getAttribute('data-i'), 10)] = c.getAttribute('data-v');
          renderInspector();
          var box = $('cands-' + c.getAttribute('data-i'));
          if (box) box.classList.add('open');
        });
      });
    }

    async function apply(reset) {
      var n = CUR;
      if (!n) return;
      var toks = reset ? [] : (n.tokens || []).map(function (t, i) { return PICK[i] || t.symbol; });
      $('insMsg').className = 'msg';
      $('insMsg').textContent = '写入中…';
      $('apply').disabled = true; $('reset').disabled = true;
      try {
        var d = await run('phoneme.set', { noteUuid: n.noteUuid, phonemes: toks.join(' ') });
        var r = firstJSON(d);
        if (!d.ok) throw new Error(d.hint || '写入失败');
        var after = (r.after && r.after.length) ? r.after : toks;
        if (reset && n.defaults && n.defaults.length) after = n.defaults.map(function (t) { return t.symbol; });
        var cat = catOf(n);
        var candFor = (n.tokens && n.tokens[0] && n.tokens[0].candidates) ? n.tokens[0].candidates : after;
        n.tokens = after.map(function (sym) {
          var c = cat[sym] || {};
          return { symbol: sym, ipa: c.ipa, manner: c.manner, official: c.official, example: c.example, candidates: candFor };
        });
        n.isOverride = !reset;
        PICK = {};
        if (CUR_EL) {
          var ph = n.tokens.map(function (t) { return '<span class="ph" title="' + esc(t.manner || '') + '">' + esc(t.symbol) + '</span>'; }).join('');
          var phons = CUR_EL.querySelector('.phons');
          if (phons) phons.innerHTML = ph || '<span class="ph">—</span>';
          if (n.isOverride) CUR_EL.classList.add('ov'); else CUR_EL.classList.remove('ov');
        }
        renderInspector();
        $('insMsg').className = 'msg ok';
        $('insMsg').textContent = reset ? '已恢复默认' : ('已写入：' + after.join(' '));
      } catch (e) {
        $('insMsg').className = 'msg bad';
        $('insMsg').textContent = '写入失败：' + e.message;
      } finally {
        $('apply').disabled = false; $('reset').disabled = false;
      }
    }

    function render(rep) {
      var grid = $('grid');
      grid.innerHTML = '';
      (rep.notes || []).forEach(function (n) {
        var el = document.createElement('div');
        el.className = 'note' + (n.isOverride ? ' ov' : '');
        el._data = n;
        var ph = (n.tokens || []).map(function (t) { return '<span class="ph" title="' + esc(t.manner || '') + '">' + esc(t.symbol) + '</span>'; }).join('');
        el.innerHTML = (n.isOverride ? '<i class="dotov" title="override"></i>' : '') +
          '<div class="phons">' + (ph || '<span class="ph">—</span>') + '</div>' +
          '<div class="word">' + esc(n.lyric || '·') + '</div>' +
          '<div class="sub">' + esc(n.language || '') + ' · ' + n.pitch + '</div>';
        el.addEventListener('click', function () { showInspector(n, el); });
        grid.appendChild(el);
      });
      var sc = rep.scope || {};
      $('scope').textContent = '片段：' + (rep.clip || '—') + ' · ' + (sc.which || '') +
        ' · 列出 ' + (rep.count || 0) + ' 个音符' + (sc.clipNoteCount ? '（片段共 ' + sc.clipNoteCount + '）' : '');
      var first = grid.querySelector('.note');
      if (first) showInspector(first._data, first);
      else { $('insBody').innerHTML = '<div class="empty">' + esc(rep.note || '没有可读的音符') + '</div>'; }
    }

    async function boot() {
      $('stat').textContent = '读取中…';
      $('dot').className = 'dot';
      CUR = null; CUR_EL = null; PICK = {};
      $('apply').disabled = true; $('reset').disabled = true;
      $('insHead').textContent = '检查器';
      $('insBody').innerHTML = '<div class="empty">读取中…</div>';
      try {
        var d = await run('phoneme.view', {});
        var rep = firstJSON(d);
        if (!d.ok) throw new Error(d.hint || '读取失败');
        window.__catalog = rep.catalog || {};
        $('dot').className = 'dot on';
        $('stat').textContent = (rep.count || 0) + ' 个音符';
        render(rep);
      } catch (e) {
        $('stat').textContent = /bridge not reachable|not running|exit 3/i.test(String(e.message))
          ? 'ACE 没开（或桥没起来）—— 先打开 ACE Studio，再点「刷新」'
          : ('读取失败：' + e.message);
        $('insBody').innerHTML = '<div class="empty">' + esc($('stat').textContent) + '</div>';
      }
    }

    $('refresh').addEventListener('click', boot);
    $('apply').addEventListener('click', function () { apply(false); });
    $('reset').addEventListener('click', function () { apply(true); });
    boot();
  </script>
</body>

</html>
