<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>音素预览</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    html,body{height:100%}
    body{margin:0;background:var(--bg,#282c33);color:var(--fg,#d6dae0);display:flex;flex-direction:column;overflow:hidden;
      font:13px/1.6 "Microsoft YaHei",system-ui,sans-serif}
    .bar{display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;flex:0 0 auto;border-bottom:1px solid var(--line,#3f434a)}
    .bar h1{font-size:13px;margin:0;font-weight:600}
    .bar .sp{flex:1}
    .stat{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim,#9498a0);min-width:0}
    .stat span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--bad,#e06c75);flex:0 0 auto}
    .dot.on{background:#5ebd7a}
    .btn{border:1px solid var(--line,#3f434a);background:var(--panel,#2f333a);color:var(--fg,#d6dae0);border-radius:6px;
      padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;flex:0 0 auto}
    .btn:hover{border-color:var(--accent,#1a73e8)}
    .btn:disabled{opacity:.45;cursor:default}
    .wrap{flex:1 1 auto;overflow:auto;padding:10px;position:relative}
    .warn{margin:0 0 10px;padding:8px 10px;border:1px solid var(--warn,#d9a441);border-left-width:4px;
      border-radius:6px;background:rgba(217,164,65,.12);color:#ffd89a;font-size:12.5px}
    .msg{color:var(--dim,#9498a0);font-size:12px}

    /* 照语调教：一排 chip（上音素、下词），悬停时在**该 chip 正下方**出现可操作面板 */
    #stage{position:relative}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{position:relative;min-width:56px;padding:3px 6px 4px;border:1px solid var(--line,#3f434a);border-radius:6px;
      background:var(--inset,#242830);cursor:default;text-align:center;user-select:none}
    .chip:hover{border-color:var(--accent,#1a73e8)}
    .chip.active{border-color:var(--accent,#1a73e8);background:rgba(26,115,232,.12)}
    .chip .ph{font:11.5px/1.35 ui-monospace,Consolas,monospace;color:#9fd2ff;white-space:nowrap}
    .chip .zi{font-size:16px;line-height:1.2}
    .chip .sub{font-size:9.5px;color:var(--dim,#9498a0)}
    .chip.ov{border-color:rgba(217,164,65,.6)}
    .chip.ov .zi{color:#ffd89a}
    .chip .dotov{position:absolute;right:3px;top:3px;width:4px;height:4px;border-radius:50%;background:var(--warn,#d9a441)}

    /* 面板：绝对定位在 chip 正下方；鼠标可以进去（不会因为离开 chip 就消失） */
    #panel{position:absolute;display:none;width:min(460px,94%);z-index:9;
      border:1px solid var(--line,#3f434a);border-radius:8px;background:var(--panel,#2f333a);
      box-shadow:0 8px 26px rgba(0,0,0,.55);padding:8px 10px;font-size:12px}
    #panel .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    #panel .hd .w{font-size:15px}
    #panel .hd .m{color:var(--dim,#9498a0);font-size:11px}
    #panel .tok{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
    #panel .tok:last-child{border-bottom:0}
    #panel .line{display:flex;align-items:center;gap:8px}
    #panel .sym{min-width:46px;text-align:center;font:12px ui-monospace,Consolas,monospace;color:#9fd2ff;
      background:rgba(26,115,232,.14);border:1px solid rgba(26,115,232,.35);border-radius:5px;padding:1px 8px;cursor:pointer}
    #panel .sym:hover{border-color:var(--accent,#1a73e8);background:rgba(26,115,232,.24)}
    #panel .meta{color:var(--dim,#9498a0);font-size:11.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #panel .cands{display:none;flex-wrap:wrap;gap:4px;margin:4px 0 2px 0}
    #panel .cands.open{display:flex}
    #panel .cand{font:12px ui-monospace,Consolas,monospace;border:1px solid var(--line,#3f434a);border-radius:5px;
      padding:1px 7px;cursor:pointer;background:var(--bg,#282c33);white-space:nowrap}
    #panel .cand:hover{border-color:var(--accent,#1a73e8);background:rgba(26,115,232,.2)}
    #panel .cand.on{border-color:var(--accent,#1a73e8);color:#9fd2ff}
    #panel .acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
    #panel .ok{color:#5ebd7a}
    #panel .bad{color:var(--bad,#e06c75)}
    #panel .warnline{color:#ffd89a;font-size:11px;margin-top:4px}
  </style>
</head>

<body>
  <div class="bar">
    <h1>音素预览</h1>
    <span class="stat"><span class="dot" id="dot"></span><span id="stat">读取中…</span></span>
    <span class="sp"></span>
    <button class="btn" id="refresh" type="button">刷新</button>
  </div>

  <div class="wrap">
    <div class="warn">上排音素、下排歌词。<b>鼠标停到音符上</b>，它正下方会展开详细音素表，点音素符号即可换；改完点「应用」。</div>
    <div id="stage">
      <div class="chips" id="chips"></div>
      <div id="panel"></div>
    </div>
    <div class="msg" id="scope"></div>
  </div>

  <script>
    var H = { 'Content-Type': 'application/json', 'X-ACETool': '1' };
    var $ = function (id) { return document.getElementById(id); };
    var DATA = [];
    var CUR = null;      // 当前面板里的音符
    var PICK = {};       // 待提交：idx → symbol
    var MSG = '';
    var hideTimer = null;
    var touched = false;   // 在面板内部操作过 ⇒ 不再自动关

    async function run(toolId, values) {
      var res = await fetch('/api/run', {
        method: 'POST', headers: H, body: JSON.stringify({ toolId: toolId, values: values || {} }),
      });
      var data = null;
      try { data = await res.json(); } catch (e) { }
      if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
      return data;
    }
    function firstJSON(d) { return ((d.calls || [])[0] || {}).json || {}; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

    function langKey(n) {
      var l = (n.language || '').toLowerCase();
      if (l.indexOf('chin') >= 0) return 'zh';
      if (l.indexOf('japan') >= 0) return 'jp';
      if (l.indexOf('engl') >= 0) return 'eng';
      if (l.indexOf('span') >= 0) return 'spa';
      return 'zh';
    }
    function catOf(n) { return (window.__catalog && window.__catalog[langKey(n)]) || {}; }
    function metaText(c) {
      if (!c) return '—';
      return [c.ipa ? '/' + c.ipa + '/' : '', c.manner || '', c.official || '', c.example ? '如 ' + c.example : '']
        .filter(Boolean).join(' · ') || '—';
    }

    function hidePanel() {
      touched = false;
      clearTimeout(hideTimer);
      $('panel').style.display = 'none';
      CUR = null; PICK = {}; MSG = '';
      [].slice.call(document.querySelectorAll('.chip.active')).forEach(function (c) { c.classList.remove('active'); });
    }
    // 未修改 ⇒ 鼠标离开自动收（300ms，容错进面板）；已修改（有待提交）⇒ 不自动收
    var lastX = -1, lastY = -1;
    function dirty() { for (var k in PICK) { if (PICK.hasOwnProperty(k)) return true; } return false; }
    function cancelHide() { clearTimeout(hideTimer); }
    function scheduleHide() {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        if (touched || dirty()) return;            // 面板里操作过（或还有未应用的修改）：不关
        var el = document.elementFromPoint(lastX, lastY);
        if (el && el.closest && (el.closest('#panel') || el.closest('.chip'))) return;
        hidePanel();
      }, 300);
    }

    /* 面板放在 chip 的**正下方**；下方放不下就放到 chip 上方；左右夹在 stage 内 */
    function placePanel(chip) {
      var panel = $('panel'), stage = $('stage');
      var sr = stage.getBoundingClientRect(), cr = chip.getBoundingClientRect();
      var w = panel.offsetWidth, h = panel.offsetHeight;
      var left = cr.left - sr.left;
      if (left + w > sr.width - 4) left = Math.max(4, sr.width - w - 4);
      var top = cr.bottom - sr.top + 4;
      if (cr.bottom + h + 8 > window.innerHeight) top = Math.max(4, cr.top - sr.top - h - 4);
      panel.style.left = Math.round(left) + 'px';
      panel.style.top = Math.round(top) + 'px';
    }

    function openPanel(n, chip) {
      // ⚠️ 不在这里复位 touched：面板里操作过之后，鼠标经过别的音符也不能让它变回“可自动关”。
      // touched 只在 hidePanel()（显式关闭）里复位。
      cancelHide();
      CUR = n; PICK = {}; MSG = '';
      [].slice.call(document.querySelectorAll('.chip.active')).forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      renderPanel();
      $('panel').style.display = 'block';
      placePanel(chip);
    }

    function renderPanel() {
      var n = CUR;
      if (!n) return;
      var cat = catOf(n);
      var rows = (n.tokens || []).map(function (t, i) {
        var cur = PICK[i] || t.symbol;
        var cands = (t.candidates && t.candidates.length ? t.candidates : [t.symbol]).slice(0, 200);
        var ch = cands.map(function (c) {
          return '<span class="cand' + (c === cur ? ' on' : '') + '" data-i="' + i + '" data-v="' + esc(c) + '" title="' +
            esc(metaText(cat[c])) + '">' + esc(c) + '</span>';
        }).join('');
        return '<div class="tok"><div class="line"><span class="sym" data-i="' + i + '">' + esc(cur) + '</span>' +
          '<span class="meta">' + esc(metaText(cat[cur])) + '</span></div>' +
          '<div class="cands" id="c' + i + '">' + ch + '</div></div>';
      }).join('');
      $('panel').innerHTML = '<div class="hd"><span class="w">' + esc(n.lyric || '·') + '</span>' +
        '<span class="m">' + esc(n.language || '') + ' · 音高 ' + n.pitch + (n.isOverride ? ' · override' : '') + '</span>' +
        '<span style="flex:1"></span><span class="m" id="pmsg">' + esc(MSG) + '</span></div>' + rows +
        '<div class="acts"><button class="btn" id="bApply" type="button">应用</button>' +
        '<button class="btn" id="bReset" type="button">恢复默认</button></div>' +
        (n.isOverride ? '' : '<div class="warnline">这个音符还没被改写过；应用后发音会固定成 override。</div>');

      [].slice.call($('panel').querySelectorAll('.sym')).forEach(function (b) {
        b.addEventListener('click', function (ev) {
          ev.stopPropagation();
          [].slice.call($('panel').querySelectorAll('.cands.open')).forEach(function (x) { x.classList.remove('open'); });
          var box = $('c' + b.getAttribute('data-i'));
          if (box) box.classList.add('open');
        });
      });
      [].slice.call($('panel').querySelectorAll('.cand')).forEach(function (c) {
        c.addEventListener('click', function (ev) {
          ev.stopPropagation();
          PICK[parseInt(c.getAttribute('data-i'), 10)] = c.getAttribute('data-v');
          MSG = '';
          renderPanel();
        });
      });
      $('bApply').addEventListener('click', function (ev) { ev.stopPropagation(); apply(n, false); });
      $('bReset').addEventListener('click', function (ev) { ev.stopPropagation(); apply(n, true); });
    }

    async function apply(n, reset) {
      var toks = reset ? [] : (n.tokens || []).map(function (t, i) { return PICK[i] || t.symbol; });
      MSG = '写入中…';
      renderPanel();
      try {
        var d = await run('phoneme.set', { noteUuid: n.noteUuid, phonemes: toks.join(' ') });
        var r = firstJSON(d);
        if (!d.ok) throw new Error(d.hint || '写入失败');
        var after = (r.after && r.after.length) ? r.after : toks;
        if (reset && n.defaults && n.defaults.length) after = n.defaults.map(function (t) { return t.symbol; });
        var cat = catOf(n);
        var candFor = (n.tokens && n.tokens[0] && n.tokens[0].candidates) ? n.tokens[0].candidates : after;
        n.tokens = after.map(function (sym) {
          var c = cat[sym] || {};
          return { symbol: sym, ipa: c.ipa, manner: c.manner, official: c.official, example: c.example, candidates: candFor };
        });
        n.isOverride = !reset;
        PICK = {};
        MSG = reset ? '已恢复默认' : ('已写入：' + after.join(' '));
        renderChips();
        // 重新定位到同一张 chip（DOM 重建了，找回它）
        var chip = document.querySelector('.chip[data-uuid="' + n.noteUuid + '"]');
        if (chip) { chip.classList.add('active'); renderPanel(); placePanel(chip); }
      } catch (e) {
        MSG = '写入失败：' + e.message;
        renderPanel();
      }
    }

    function renderChips() {
      var box = $('chips');
      box.innerHTML = '';
      DATA.forEach(function (n) {
        var el = document.createElement('div');
        el.className = 'chip' + (n.isOverride ? ' ov' : '');
        el.setAttribute('data-uuid', n.noteUuid);
        var ph = (n.tokens || []).map(function (t) { return esc(t.symbol); }).join(' ');
        el.innerHTML = (n.isOverride ? '<i class="dotov"></i>' : '') +
          '<div class="ph">' + (ph || '—') + '</div>' +
          '<div class="zi">' + esc(n.lyric || '·') + '</div>' +
          '<div class="sub">' + esc(n.language || '') + ' · ' + n.pitch + '</div>';
        el.addEventListener('mouseenter', function () { openPanel(n, el); });
        el.addEventListener('mouseleave', scheduleHide);
        box.appendChild(el);
      });
    }


    $('panel').addEventListener('pointerdown', function () { touched = true; cancelHide(); });
    $('panel').addEventListener('mouseenter', cancelHide);
    $('panel').addEventListener('mouseleave', scheduleHide);
    document.addEventListener('pointermove', function (ev) {
      lastX = ev.clientX; lastY = ev.clientY;
      if ($('panel').style.display !== 'block') return;
      if (dirty()) { cancelHide(); return; }
      var el = document.elementFromPoint(lastX, lastY);
      if (el && el.closest && (el.closest('#panel') || el.closest('.chip'))) cancelHide();
      else scheduleHide();
    }, { passive: true });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hidePanel(); });
    document.addEventListener('pointerdown', function (ev) {
      if (!CUR) return;
      if ($('panel').contains(ev.target)) return;
      if (ev.target && ev.target.closest && ev.target.closest('.chip')) return; // 换音符由 mouseenter 处理
      hidePanel();
    }, true);
    window.addEventListener('resize', function () {
      var chip = document.querySelector('.chip.active');
      if (chip && $('panel').style.display === 'block') placePanel(chip);
    });

    async function boot() {
      $('stat').textContent = '读取中…';
      $('dot').className = 'dot';
      hidePanel();
      try {
        var d = await run('phoneme.view', {});
        var rep = firstJSON(d);
        if (!d.ok) throw new Error(d.hint || '读取失败');
        window.__catalog = rep.catalog || {};
        DATA = rep.notes || [];
        $('dot').className = 'dot on';
        $('stat').textContent = DATA.length + ' 个音符';
        var sc = rep.scope || {};
        $('scope').textContent = '片段：' + (rep.clip || '—') + ' · ' + (sc.which || '') +
          ' · 列出 ' + DATA.length + ' 个音符' + (sc.clipNoteCount ? '（片段共 ' + sc.clipNoteCount + '）' : '') +
          (rep.note ? ' · ' + rep.note : '');
        renderChips();
      } catch (e) {
        $('stat').textContent = /bridge not reachable|not running|exit 3/i.test(String(e.message))
          ? 'ACE 没开（或桥没起来）—— 先打开 ACE Studio，再点「刷新」'
          : ('读取失败：' + e.message);
      }
    }

    $('refresh').addEventListener('click', boot);
    boot();
  </script>
</body>

</html>
